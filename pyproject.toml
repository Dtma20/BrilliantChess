[project]
name = "brilliant-chess"
version = "0.1.0"
description = "Analisador e seletor de jogadas brilhantes baseado em Stockfish e regras auditaveis."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Diogo Amorim", email = "diogo.amorim@edge.ufal.br" }]
dependencies = [
    "chess>=1.11.2",
    "fastapi>=0.115.0",
    "pydantic>=2.11.0",
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
    "structlog>=25.1.0",
    "typer>=0.16.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
brilliant-chess = "brilliant_chess.interfaces.cli.app:main"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "hypothesis>=6.130.0",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.0",
    "ruff>=0.11.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brilliant_chess"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# TCH (imports em bloco de type-checking) fica fora de proposito: pydantic e os
# dataclasses com default_factory precisam dos tipos disponiveis em tempo de
# execucao, e mover imports para TYPE_CHECKING quebraria a validacao.
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF",
    "ANN", "ARG", "PL", "PT", "RET", "TID",
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "PLR0913"]
"scripts/**" = ["T201"]
# Adapters sao o unico lugar autorizado a usar python-chess (ADR 0004).
# Fakes de teste tambem precisam montar posicoes reais.
"src/brilliant_chess/adapters/**" = ["TID251"]
"tests/fakes/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"chess".msg = "python-chess e permitido apenas em adapters (ver ADR 0004)."

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["brilliant_chess"]
warn_unreachable = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["chess.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: testes de integracao que exigem Stockfish real",
    "golden: testes golden com orcamento fixo em nos",
]

[tool.coverage.run]
source = ["src/brilliant_chess"]
branch = true

[tool.coverage.report]
show_missing = true
