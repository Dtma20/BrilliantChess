<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jogar — Brilliant Chess</title>
<link rel="stylesheet" href="/static/app.css" />
</head>
<body>
<header class="top">
  <a class="brand" href="/">Brilliant Chess <span>· estudo local</span></a>
  <nav aria-label="Seções">
    <a href="/">Início</a>
    <a href="/jogar" class="active" aria-current="page">Jogar</a>
    <a href="/analise">Análise</a>
    <a href="/laboratorio">Laboratório</a>
  </nav>
</header>
<div class="fairplay">
  Partida local de estudo. Não use este app durante partidas ao vivo em nenhuma plataforma: isso é trapaça.
</div>
<main>
  <section>
    <h1 class="page-title" style="margin-bottom:0.9rem">Partida contra o motor</h1>
    <div class="board-wrap"><div id="board"></div></div>
  </section>
  <aside>
    <div class="panel">
      <h2>Nova partida</h2>
      <div class="row">
        <label for="color">Suas peças</label>
        <select id="color">
          <option value="white">Brancas</option>
          <option value="black">Pretas</option>
        </select>
      </div>
      <div class="row">
        <label for="strength">Força do motor</label>
        <select id="strength"></select>
      </div>
      <div class="row">
        <button class="primary" id="new-game" type="button">Começar</button>
        <button id="undo" type="button">Voltar lance</button>
        <button id="flip" type="button">Girar</button>
        <button id="export-pgn" type="button" disabled>PGN</button>
      </div>
    </div>
    <div class="panel" style="margin-top:1rem">
      <h2>Situação</h2>
      <p class="status" id="status">Escolha as peças e comece.</p>
      <p class="error" id="error" role="alert"></p>
      <div class="moves" id="moves"></div>
    </div>
  </aside>
</main>
<script type="module" src="/static/play.js"></script>
</body>
</html>
